name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Top-level least-privilege. CI is pure read; no job escalates.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Validate manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('✓ manifest.json is valid')"

      - name: Validate language JSON files
        run: |
          status=0
          for f in src/data/*.json; do
            if node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" 2>/dev/null; then
              echo "✓ $f"
            else
              echo "✗ $f — invalid JSON"
              status=1
            fi
          done
          exit $status

      - name: Validate translation files
        run: node scripts/validate-translations.js

      - name: Check glossary consistency
        run: node scripts/check-glossary.js

      - name: Check i18n key coverage
        run: node scripts/check-i18n-keys.js

      - name: Check locale cross-contamination (wrong-language values)
        run: node scripts/check-locale-contamination.js

      - name: Check dictionary coverage (48h terminology SLA)
        run: node scripts/check-dict-coverage.js

      - name: Check shared constants sync
        run: node scripts/check-bg-sync.js

      - name: Check dictionary freshness
        run: node scripts/check-dicts.js

      - name: Check Claude Code plugin data is in sync
        run: node scripts/build-plugin.js --check

      # Guards the CWS review surface: a privacy disclosure naming a service the
      # manifest can no longer reach, or a granted host no document discloses.
      # Content scripts reach each other only through window globals, while the
      # same libraries carry a CommonJS block for the tests. A name added to one
      # and not the other is invisible to jest, eslint and the bundler, and
      # throws only in the browser.
      - name: Check window surfaces match what content scripts dereference
        run: node scripts/check-window-surface.js

      - name: Check permission docs match manifest.json
        run: node scripts/check-permission-docs.js

      # The shipped lesson-identity table is generated from the identity report.
      # A stale table does not fail visibly — it just stops linking the lessons
      # it no longer covers, so a learner's notes go missing with no error.
      - name: Check canonical lesson lookup is in sync with the identity report
        run: node scripts/build-canonical-lookup.js --check

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npx eslint src/ tests/ scripts/

      - name: Type-check JavaScript
        run: npm run typecheck

      - name: Check formatting
        run: npx prettier --check 'src/**/*.{js,css,html}' 'tests/**/*.js' 'scripts/**/*.js'

      - name: DOM health check (Skilljar selectors)
        run: node scripts/check-selectors.js
        env:
          CI: 'true'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Firefox artifact
        run: npm run build:firefox

      - name: Build bundled artifact
        run: npm run build:bundle

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx jest --passWithNoTests

  e2e:
    # Playwright E2E. Loads the actual built extension into headed Chromium
    # under xvfb so MV3 content scripts inject reliably (the new chromium
    # headless mode in --load-extension still has flake we'd rather avoid).
    # Catches the class of cross-module wiring bug that unit tests miss
    # (see tests/e2e/golden-translation.spec.js header for the rationale).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache Playwright Chromium binary so re-runs skip the ~120MB download.
      # Key on package-lock.json so a @playwright/test version bump invalidates.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install xvfb (always) + Playwright Chromium (conditional)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          else
            # Cache hit — only install OS deps for the cached browser.
            npx playwright install-deps chromium
          fi

      - name: Run E2E suite under xvfb
        # The translation performance budgets are wall-clock measurements of a
        # real Chromium boot plus a full async chain, so on a shared runner they
        # measure the runner as much as the extension — performance-budget.spec
        # went red on main this way while every other spec passed. Relax them
        # HERE rather than in the spec, so a developer's local run keeps the
        # strict 8s/5s guard. The looser CI numbers still catch the regression
        # the spec is actually for ("the extension feels stuck" / never
        # translates); what CI gives up is catching a drift from, say, 8s to
        # 18s, which local runs and the tighter default still surface.
        env:
          SB_E2E_VISIBLE_TRANSLATION_BUDGET_MS: '25000'
          SB_E2E_LAZY_SCROLL_TRANSLATION_BUDGET_MS: '20000'
        run: xvfb-run -a npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

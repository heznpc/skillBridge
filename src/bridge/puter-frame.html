<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SkillBridge Puter broker</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      /* Hidden until the frame asks for a sign-in; the host page only makes the
         frame visible at the same moment. */
      #sb-auth {
        display: none;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        background: rgba(28, 25, 23, 0.55);
      }
      #sb-auth.sb-visible {
        display: flex;
      }
      #sb-auth-card {
        background: #fff;
        color: #1c1917;
        max-width: 380px;
        margin: 16px;
        padding: 24px;
        border-radius: 14px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
        text-align: center;
      }
      #sb-auth-title {
        font-size: 17px;
        font-weight: 600;
        margin-bottom: 10px;
      }
      #sb-auth-body {
        font-size: 14px;
        line-height: 1.6;
        color: #57534e;
        margin-bottom: 20px;
      }
      #sb-auth-go {
        width: 100%;
        padding: 11px 16px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        background: #3d405b;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      #sb-auth-go:hover {
        background: #2e3047;
      }
      #sb-auth-cancel {
        margin-top: 10px;
        width: 100%;
        padding: 9px 16px;
        font-size: 13px;
        color: #78716c;
        background: transparent;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      #sb-auth-go[disabled] {
        opacity: 0.6;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <!-- The sign-in MUST be started by a click inside this extension-origin
         frame: Chrome does not propagate user activation from the host page
         into a cross-origin iframe, so Puter's window.open popup is blocked
         when the chat call tries to authenticate on its own. -->
    <div id="sb-auth" role="dialog" aria-modal="true" aria-labelledby="sb-auth-title">
      <div id="sb-auth-card">
        <div id="sb-auth-title"></div>
        <div id="sb-auth-body"></div>
        <button id="sb-auth-go" type="button"></button>
        <button id="sb-auth-cancel" type="button"></button>
      </div>
    </div>
    <script src="puter-frame-init.js"></script>
    <script src="puter.js"></script>
    <script src="puter-frame.js"></script>
  </body>
</html>

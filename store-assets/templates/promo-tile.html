<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root { --ink:#3d405b; --paper:#fafaf9; --line:#dededb; --coral:#e07a5f; --sage:#81b29a; --muted:#71737d; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .tile { position:relative; width:440px; height:280px; overflow:hidden; border:1px solid var(--line); background:var(--paper); color:var(--ink); }
    .tile::after { content:""; position:absolute; top:0; bottom:0; left:55%; width:1px; background:var(--line); }
    .brand { position:absolute; z-index:2; top:24px; left:27px; display:flex; align-items:center; gap:8px; font-size:17px; font-weight:780; letter-spacing:-.045em; }
    .brand img { width:25px; height:25px; }
    .tagline { position:absolute; z-index:2; top:76px; left:27px; width:205px; font-size:14px; font-weight:690; line-height:1.28; letter-spacing:-.025em; }
    .steps { position:absolute; z-index:2; top:164px; left:27px; display:grid; gap:7px; color:var(--muted); font-size:10px; line-height:1.25; }
    .steps b { margin-right:7px; color:var(--coral); font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .screen { position:absolute; top:47px; left:263px; width:282px; height:188px; overflow:hidden; border:1px solid #d8d9de; border-radius:6px 0 0 6px; background:#fff; box-shadow:0 12px 24px rgba(61,64,91,.12); }
    .screen img { display:block; width:100%; height:100%; object-fit:cover; object-position:top left; }
    .translated { position:absolute; z-index:3; right:14px; bottom:16px; display:flex; align-items:center; gap:6px; padding:6px 7px; border:1px solid #c7e0d2; border-radius:4px; background:#f4fbf6; color:#3f755c; font-size:9px; font-weight:700; }
    .translated::before { content:""; width:5px; height:5px; border-radius:50%; background:var(--sage); }
    .disclaimer { position:absolute; z-index:3; left:27px; bottom:14px; width:200px; color:#9a9aa0; font-size:8px; line-height:1.2; }
  </style>
</head>
<body>
  <main class="tile">
    <div class="brand"><img src="../../assets/icons/icon128.png" alt="" />SkillBridge</div>
    <div class="tagline">{{TAGLINE}}</div>
    <div class="steps"><div><b>01</b>Open a supported lesson</div><div><b>02</b>Choose a language</div><div><b>03</b>Stay in the course</div></div>
    <figure class="screen"><img src="../01-translate.png" alt="Translated AI course" /></figure>
    <div class="translated">IN-COURSE TRANSLATION</div>
    <div class="disclaimer">{{DISCLAIMER}}</div>
  </main>
</body>
</html>

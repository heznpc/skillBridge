<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root { --ink:#3d405b; --paper:#fafaf9; --line:#dfdfdc; --coral:#e07a5f; --sage:#81b29a; --muted:#686b78; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--paper); color:var(--ink); }
    .stage { position:relative; width:100%; height:100%; overflow:hidden; background:var(--paper); }
    .stage::before { content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent 0 56%,rgba(61,64,91,.035) 56% 100%); pointer-events:none; }
    .topline { position:absolute; z-index:4; top:5.4%; left:6.8%; right:6.8%; display:flex; justify-content:space-between; align-items:center; padding-bottom:16px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; font-size:clamp(18px,1.8vw,28px); font-weight:760; letter-spacing:-.04em; }
    .brand img { width:clamp(26px,2.4vw,38px); height:clamp(26px,2.4vw,38px); }
    .build { color:var(--muted); font:600 clamp(10px,1vw,15px) ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.04em; text-transform:uppercase; }
    .copy { position:absolute; z-index:3; top:19%; left:6.8%; width:45%; }
    .eyebrow { color:var(--coral); font:700 clamp(11px,1.15vw,17px) ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.09em; text-transform:uppercase; }
    h1 { max-width:12ch; margin:22px 0 0; font-size:clamp(50px,6vw,104px); line-height:.93; letter-spacing:-.075em; white-space:pre-line; }
    .body { max-width:34rem; margin-top:24px; color:var(--muted); font-size:clamp(16px,1.55vw,25px); line-height:1.48; }
    .facts { display:grid; gap:0; width:min(100%,560px); margin-top:clamp(26px,4vw,58px); border-top:1px solid var(--line); }
    .fact { display:flex; gap:13px; padding:12px 0; border-bottom:1px solid var(--line); color:var(--ink); font-size:clamp(13px,1.18vw,18px); font-weight:650; }
    .fact b { flex:0 0 26px; color:var(--coral); font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace; padding-top:3px; }
    .course { position:absolute; z-index:2; top:14%; right:-5%; width:55%; height:73%; overflow:hidden; border:1px solid #d8d9dd; border-radius:10px 0 0 10px; background:#fff; box-shadow:0 24px 60px rgba(61,64,91,.17); }
    .course>img { display:block; width:100%; height:100%; object-fit:cover; object-position:top left; opacity:.97; }
    .surface-note { position:absolute; z-index:3; right:5.8%; bottom:11%; width:min(30%,340px); padding:15px 17px; border:1px solid #bdd8ca; border-radius:6px; background:#f5fbf7; box-shadow:0 12px 25px rgba(45,82,64,.13); color:#315d4a; font-size:clamp(11px,1.05vw,16px); line-height:1.35; }
    .surface-note::before { content:""; display:inline-block; width:7px; height:7px; margin:0 8px 1px 0; border-radius:50%; background:var(--sage); }
    .caption { position:absolute; z-index:4; left:6.8%; bottom:5.7%; color:#81838d; font-size:clamp(10px,.92vw,14px); letter-spacing:.015em; }
    @media (max-aspect-ratio:4/5) { .topline { top:4.5%; }.copy { top:14%; width:86%; }.course { top:auto; right:-7%; bottom:8%; width:79%; height:29%; }.surface-note { right:7%; bottom:9%; width:45%; }.facts { margin-top:32px; } h1 { max-width:11ch; font-size:clamp(60px,10vw,120px); } .body { max-width:30rem; } .caption { bottom:3.6%; } }
    @media (min-aspect-ratio:5/4) { .copy { top:17%; }.course { top:16%; height:68%; }.facts { margin-top:30px; }.fact { padding:9px 0; }.caption { bottom:3.2%; } }
  </style>
</head>
<body>
  <main class="stage">
    <header class="topline"><div class="brand"><img src="../../assets/icons/icon128.png" alt="" />SkillBridge</div><div class="build">AI course translator</div></header>
    <section class="copy">
      <div class="eyebrow">{{EYEBROW}}</div>
      <h1>{{HEADLINE}}</h1>
      <p class="body">{{BODY}}</p>
      <div class="facts"><div class="fact"><b>01</b>Language changes inside the current lesson</div><div class="fact"><b>02</b>Terminology and assessment boundaries remain intact</div><div class="fact"><b>03</b>{{CTA}}</div></div>
    </section>
    <figure class="course"><img src="../01-translate.png" alt="Translated AI Academy lesson in SkillBridge" /></figure>
    <aside class="surface-note">Translation stays in the course context.</aside>
    <div class="caption">{{DISCLAIMER}}</div>
  </main>
</body>
</html>
